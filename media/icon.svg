<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="BiSql">
  <defs>
    <linearGradient id="tile" x1="16" y1="0" x2="118" y2="128" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1A4542"/>
      <stop offset="1" stop-color="#0C2422"/>
    </linearGradient>
    <linearGradient id="bFill" x1="14" y1="34" x2="74" y2="116" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7FFFE"/>
      <stop offset="1" stop-color="#D7F3F0"/>
    </linearGradient>
    <linearGradient id="sFill" x1="66" y1="34" x2="116" y2="116" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5EEAE3"/>
      <stop offset="1" stop-color="#2BB8B2"/>
    </linearGradient>
  </defs>

  <rect width="128" height="128" fill="url(#tile)"/>
  <rect width="128" height="20" fill="#3DCCC7"/>
  <path d="M0 20h128" stroke="#102422" stroke-width="1.2" opacity=".35"/>
  <rect x="10" y="28" width="108" height="34" rx="17" fill="#fff" opacity=".05"/>

