<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src {{csp}} 'nonce-{{nonce}}'; script-src {{csp}} 'nonce-{{nonce}}';" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SQL Results</title>
<link rel="stylesheet" href="{{cssTheme}}" />
<link rel="stylesheet" href="{{css}}" />
</head>
<body>
  <div class="topbar">
    <div class="title-row">
      <h1 id="pageTitle" hidden>Query results</h1>
      <span class="scan-cost" id="scanCost" hidden></span>
      <div class="info-wrap">
        <button type="button" class="icon-btn" id="btnInfo" aria-expanded="false" title="Query info" aria-label="Query info"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.4" fill="none" stroke="currentColor" stroke-width="1.2"/><circle cx="8" cy="5.1" r="0.85" fill="currentColor"/><path d="M8 7.3v4.2" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></button>
        <div class="info-pop" id="infoPop" hidden>
          <button type="button" class="icon-btn msg-close" title="Close" aria-label="Close"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.2 4.2 11.8 11.8M11.8 4.2 4.2 11.8" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></button>
          <div id="infoBody"></div>
        </div>
      </div>
    </div>
    <div class="actions" id="toolbar" hidden>
      <button type="button" class="secondary" id="btnDetailed" aria-pressed="false" title="Show column type and flags">Detailed</button>
      <button type="button" class="icon-btn" id="btnRefresh" title="Refresh" aria-label="Refresh"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M13 8a5 5 0 1 1-1.5-3.6" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M13 2.8v3.3h-3.3" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <span class="toolbar-split"></span>
      <span class="split">
        <button type="button" class="icon-btn" id="btnCopy" title="Copy this page as JSON" aria-label="Copy"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><rect x="5.4" y="5.6" width="7" height="7.6" rx="1.1" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M3.6 10.2V3.8c0-.6.5-1.1 1.1-1.1h6.4" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg></button>
        <button type="button" class="icon-btn" id="btnSave" title="Save this page as JSON" aria-label="Save"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3.2v7M5.3 7.4 8 10.1l2.7-2.7M3.4 12.7h9.2" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button type="button" class="icon-btn split-more" id="btnExportMenu" title="Choose what to copy or save" aria-label="Choose what to copy or save" aria-haspopup="menu" aria-expanded="false"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.2 6.2 8 10l3.8-3.8" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </span>
      <span class="toolbar-split"></span>
      <span class="page-label" id="pageLabel">No rows</span>
      <button type="button" class="icon-btn is-off" id="btnPrev" title="Previous page" aria-label="Previous page" aria-disabled="true"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3.2 5.2 8 10 12.8" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button type="button" class="icon-btn is-off" id="btnNext" title="Next page" aria-label="Next page" aria-disabled="true"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3.2 10.8 8 6 12.8" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <label class="export-label" title="Rows per page">
        <select id="pageSize" aria-label="Rows per page"></select>
      </label>
    </div>
  </div>
  <section class="sql-box" id="sqlBox">
    <div class="sql-bar">
      <button type="button" class="sql-toggle" id="btnSqlToggle" aria-expanded="false">
        <span class="chevron"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 4.2 10 8 6 11.8" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="sql-name">SQL</span>
        <span class="sql-preview" id="sqlPreview"></span>
      </button>
      <button type="button" class="icon-btn" id="btnEditSql" title="Edit in editor" aria-label="Edit in editor"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.2 10.3 9.9 3.6 12 5.7 5.3 12.4H3.2z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/><path d="M8.7 4.8 10.8 6.9" fill="none" stroke="currentColor" stroke-width="1.2"/></svg></button>
      <button type="button" class="secondary" id="btnRunSql" title="Run (Ctrl+Enter)"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.2 2.8v10.4L13.2 8z" fill="currentColor"/></svg> Run</button>
      <button type="button" class="icon-btn" id="btnCopySql" title="Copy SQL" aria-label="Copy SQL"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><rect x="5.4" y="5.6" width="7" height="7.6" rx="1.1" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M3.6 10.2V3.8c0-.6.5-1.1 1.1-1.1h6.4" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg></button>
    </div>
    <div class="sql-body" id="sqlBody">
      <pre class="sql" id="sqlText"></pre>
      <div class="label" id="paramLabel" hidden>Parameters</div>
      <div class="params" id="paramList" hidden></div>
    </div>
  </section>
  <div class="status" id="liveStatus" hidden>
    <span class="status-text"></span>
    <button type="button" class="icon-btn msg-close" title="Close" aria-label="Close"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.2 4.2 11.8 11.8M11.8 4.2 4.2 11.8" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></button>
  </div>
  <div class="status info" id="resultBanner" hidden>
    <span class="status-text"></span>
    <button type="button" class="icon-btn msg-close" title="Close" aria-label="Close"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.2 4.2 11.8 11.8M11.8 4.2 4.2 11.8" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></button>
  </div>
  <div id="tableHost"></div>
  <div class="ctx-menu" id="exportMenu" hidden>
    <button type="button" data-scope="table" aria-pressed="true">This page</button>
    <button type="button" data-scope="row">This row</button>
    <button type="button" data-scope="cell">This cell</button>
    <div class="ctx-sep"></div>
    <button type="button" data-format="json" aria-pressed="true">JSON</button>
    <button type="button" data-format="csv">CSV</button>
  </div>
  <div class="ctx-menu" id="headerMenu" hidden>
    <button type="button" data-act="rename">Rename column</button>
  </div>
  <div class="ctx-menu" id="ctxMenu" hidden>
    <button type="button" data-act="edit">Edit cell</button>
    <button type="button" data-act="null">Set NULL</button>
    <button type="button" data-act="duplicate">Duplicate row</button>
    <button type="button" data-act="delete">Delete row</button>
    <div class="ctx-sep"></div>
    <button type="button" data-act="viewCell">View cell</button>
    <button type="button" data-act="openCell">Open in editor</button>
    <button type="button" data-act="viewRow">View row</button>
    <button type="button" data-act="copyCell">Copy cell</button>
    <button type="button" data-act="copyRow">Copy row</button>
  </div>
  <div class="viewer" id="cellViewer">
    <div class="viewer-panel" role="dialog" aria-modal="true" aria-labelledby="viewerTitle">
      <div class="viewer-bar">
        <span class="viewer-title" id="viewerTitle">Cell</span>
        <div class="viewer-actions">
          <button type="button" class="secondary" id="viewerToggle">View row</button>
          <button type="button" class="secondary" id="viewerOpen" title="Open this cell in an editor">Open in editor</button>
          <button type="button" class="icon-btn" id="viewerCopy" title="Copy"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><rect x="5.4" y="5.6" width="7" height="7.6" rx="1.1" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M3.6 10.2V3.8c0-.6.5-1.1 1.1-1.1h6.4" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg></button>
          <button type="button" class="icon-btn" id="viewerClose" title="Close"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.2 4.2 11.8 11.8M11.8 4.2 4.2 11.8" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></button>
        </div>
      </div>
      <div class="viewer-body" id="viewerBody"></div>
    </div>
  </div>
<script nonce="{{nonce}}">window.__BISQL_BOOTSTRAP__ = {{boot}};</script>
<script nonce="{{nonce}}" src="{{jsCommon}}"></script>
<script nonce="{{nonce}}" src="{{jsDate}}"></script>
<script nonce="{{nonce}}" src="{{js}}"></script>
</body>
</html>
