<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src {{csp}} 'nonce-{{nonce}}'; script-src {{csp}} 'nonce-{{nonce}}';" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SQL Results</title>
<link rel="stylesheet" href="{{css}}" />
</head>
<body>
  <div class="topbar">
    <div class="title-row">
      <span class="title-mark"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><rect x="1.4" y="2.4" width="13.2" height="11.2" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M1.4 5.8h13.2M5.8 5.8v7.8M10.2 5.8v7.8M1.4 9.3h13.2" fill="none" stroke="currentColor" stroke-width="1.1"/></svg></span>
      <h1 id="pageTitle">Query results</h1>
      <div class="info-wrap">
        <button type="button" class="icon-btn" id="btnInfo" aria-expanded="false" title="Query info"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.4" fill="none" stroke="currentColor" stroke-width="1.2"/><circle cx="8" cy="5.1" r="0.85" fill="currentColor"/><path d="M8 7.3v4.2" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></button>
        <div class="info-pop" id="infoPop" hidden></div>
      </div>
    </div>
    <div class="actions" id="toolbar" hidden>
      <span id="editActions" hidden>
        <button type="button" class="icon-btn" id="btnNull" disabled title="Set NULL"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.4" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M4.3 11.7 11.7 4.3" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg></button>
        <button type="button" class="icon-btn" id="btnDuplicate" disabled title="Duplicate row"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><rect x="5.6" y="5.4" width="7.2" height="7.2" rx="1.1" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M4.2 10.4V3.8c0-.6.5-1.1 1.1-1.1h6.4" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg></button>
        <button type="button" class="icon-btn" id="btnDelete" disabled title="Delete row"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.4 4.8h9.2M6.2 4.8V3.6h3.6v1.2M5.3 4.8l.5 7.4h4.4l.5-7.4" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg></button>
        <button type="button" class="icon-btn" id="btnRename" disabled title="Rename column"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M9.5 3.5 12.4 6.4 5.7 13.1H2.8v-2.9z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg></button>
        <span class="toolbar-split"></span>
      </span>
      <button type="button" class="secondary" id="btnDetailed" aria-pressed="false" title="Show column type and flags"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.2 4.2h9.6M3.2 8h9.6M3.2 11.8h6.2" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg> Detailed</button>
      <button type="button" class="secondary" id="btnRefresh"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M13 8a5 5 0 1 1-1.5-3.6" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M13 2.8v3.3h-3.3" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg> Refresh</button>
      <span class="toolbar-split"></span>
      <label class="export-label">
        <select id="exportScope" title="Export scope">
          <option value="table">This page</option>
          <option value="row" disabled>This row</option>
          <option value="cell" disabled>This cell</option>
        </select>
      </label>
      <label class="export-label">
        <select id="exportFormat" title="Export format">
          <option value="json">JSON</option>
          <option value="csv">CSV</option>
        </select>
      </label>
      <button type="button" class="secondary" id="btnCopy"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><rect x="5.4" y="5.6" width="7" height="7.6" rx="1.1" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M3.6 10.2V3.8c0-.6.5-1.1 1.1-1.1h6.4" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg> Copy</button>
      <button type="button" class="secondary" id="btnSave"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3.2v7M5.3 7.4 8 10.1l2.7-2.7M3.4 12.7h9.2" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg> Save</button>
    </div>
  </div>
  <section class="sql-box" id="sqlBox">
    <div class="sql-bar">
      <button type="button" class="sql-toggle" id="btnSqlToggle" aria-expanded="false">
        <span class="chevron"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 4.2 10 8 6 11.8" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="sql-name">SQL</span>
        <span class="sql-preview" id="sqlPreview"></span>
      </button>
      <button type="button" class="secondary" id="btnEditSql" title="Edit in editor"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.2 10.3 9.9 3.6 12 5.7 5.3 12.4H3.2z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/><path d="M8.7 4.8 10.8 6.9" fill="none" stroke="currentColor" stroke-width="1.2"/></svg> Edit</button>
      <button type="button" class="secondary" id="btnRunSql" title="Run (Ctrl+Enter)"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.2 2.8v10.4L13.2 8z" fill="currentColor"/></svg> Run</button>
      <button type="button" class="icon-btn" id="btnCopySql" title="Copy SQL"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><rect x="5.4" y="5.6" width="7" height="7.6" rx="1.1" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M3.6 10.2V3.8c0-.6.5-1.1 1.1-1.1h6.4" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg></button>
    </div>
    <div class="sql-body" id="sqlBody">
      <pre class="sql" id="sqlText"></pre>
      <div class="label" id="paramLabel" hidden>Parameters</div>
      <div class="params" id="paramList" hidden></div>
    </div>
  </section>
  <div class="pager" id="pager" hidden>
    <button type="button" class="secondary" id="btnPrev" disabled>Previous</button>
    <span class="page-label" id="pageLabel">No rows</span>
    <button type="button" class="secondary" id="btnNext" disabled>Next</button>
    <label class="export-label">Rows per page
      <select id="pageSize"></select>
    </label>
  </div>
  <div class="status" id="liveStatus" hidden></div>
  <div class="status info" id="resultBanner" hidden></div>
  <div id="tableHost"></div>
  <div class="ctx-menu" id="ctxMenu" hidden>
    <button type="button" data-act="edit">Edit cell</button>
    <button type="button" data-act="null">Set NULL</button>
    <button type="button" data-act="duplicate">Duplicate row</button>
    <button type="button" data-act="delete">Delete row</button>
    <div class="ctx-sep"></div>
    <button type="button" data-act="viewCell">View cell</button>
    <button type="button" data-act="viewRow">View row</button>
    <button type="button" data-act="copyCell">Copy cell</button>
    <button type="button" data-act="copyRow">Copy row</button>
  </div>
  <div class="viewer" id="cellViewer">
    <div class="viewer-panel" role="dialog" aria-modal="true" aria-labelledby="viewerTitle">
      <div class="viewer-bar">
        <span class="viewer-title" id="viewerTitle">Cell</span>
        <div class="viewer-actions">
          <button type="button" class="secondary" id="viewerToggle">View row</button>
          <button type="button" class="icon-btn" id="viewerCopy" title="Copy"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><rect x="5.4" y="5.6" width="7" height="7.6" rx="1.1" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M3.6 10.2V3.8c0-.6.5-1.1 1.1-1.1h6.4" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg></button>
          <button type="button" class="icon-btn" id="viewerClose" title="Close"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.2 4.2 11.8 11.8M11.8 4.2 4.2 11.8" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></button>
        </div>
      </div>
      <div class="viewer-body" id="viewerBody"></div>
    </div>
  </div>
<script nonce="{{nonce}}">window.__BISQL_BOOTSTRAP__ = {{boot}};</script>
<script nonce="{{nonce}}" src="{{js}}"></script>
</body>
</html>
